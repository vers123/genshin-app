<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据搜索 - 原神数据库</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="site-header">
        <div class="site-header-inner">
            <a href="./index.html" class="site-logo">
                <span class="site-logo-icon">&#127793;</span>
                <span class="site-logo-text">原神数据库</span>
            </a>
            <nav class="site-nav">
                <a href="./index.html">首页</a>
                <a href="./search.html" class="active">搜索</a>
                <a href="./database.html">百科</a>
            </nav>
            <div class="site-lang"></div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="search-container">
        <h1 class="search-page-title">数据搜索</h1>
        <p class="search-page-subtitle">支持分类查询 · 综合搜索（跨所有类别）· 结果分页 · 七圣召唤</p>

        <!-- 搜索栏 -->
        <div class="search-box">
            <input type="text" id="queryInput" placeholder="输入名称，如：芙宁娜、雾切、原石..." list="searchHistory" autocomplete="off" />
            <datalist id="searchHistory"></datalist>

            <select id="folderSelect">
                <option value="all" style="color: var(--gold); font-weight: bold;">综合搜索（全部）</option>
                <optgroup label="角色相关">
                    <option value="characters">角色</option>
                    <option value="talents">天赋</option>
                    <option value="constellations">命之座</option>
                    <option value="outfits">衣装</option>
                </optgroup>
                <optgroup label="装备道具">
                    <option value="weapons">武器</option>
                    <option value="artifacts">圣遗物</option>
                    <option value="materials">材料</option>
                </optgroup>
                <optgroup label="世界探索">
                    <option value="foods">食物</option>
                    <option value="domains">秘境</option>
                    <option value="enemies">敌人</option>
                    <option value="animals">动物</option>
                    <option value="geographies">地理志</option>
                </optgroup>
                <optgroup label="收集与成就">
                    <option value="achievements">成就</option>
                    <option value="achievementgroups">成就组</option>
                    <option value="namecards">名片</option>
                    <option value="windgliders">风之翼</option>
                </optgroup>
                <optgroup label="七圣召唤">
                    <option value="tcgcharactercards">角色卡</option>
                    <option value="tcgactioncards">行动卡</option>
                    <option value="tcgcardbacks">卡背</option>
                    <option value="tcgcardboxes">卡盒</option>
                    <option value="tcgkeywords">关键词</option>
                    <option value="tcgsummons">召唤物</option>
                    <option value="tcgstatuseffects">状态效果</option>
                    <option value="tcgdetailedrules">详细规则</option>
                    <option value="tcglevelrewards">等级奖励</option>
                </optgroup>
                <optgroup label="其他">
                    <option value="adventureranks">冒险等阶</option>
                    <option value="elements">元素</option>
                    <option value="crafts">锻造</option>
                    <option value="rarity">稀有度</option>
                    <option value="talentmaterialtypes">天赋材料类型</option>
                </optgroup>
            </select>

            <span id="totalCountDisplay" class="total-count">总数：--</span>

            <select id="langSelect">
                <option value="ChineseSimplified">简体中文</option>
                <option value="ChineseTraditional">繁體中文</option>
                <option value="English">English</option>
                <option value="French">Français</option>
                <option value="German">Deutsch</option>
                <option value="Indonesian">Bahasa Indonesia</option>
                <option value="Japanese">日本語</option>
                <option value="Korean">한국어</option>
                <option value="Portuguese">Português</option>
                <option value="Russian">Русский</option>
                <option value="Spanish">Español</option>
                <option value="Thai">ภาษาไทย</option>
                <option value="Vietnamese">Tiếng Việt</option>
            </select>

            <button id="searchBtn">查询</button>
        </div>

        <!-- 结果展示 -->
        <div class="result-area" id="resultArea">
            <div class="placeholder">选择"综合搜索"可跨所有类别查询<br>也可选择具体分类精准查询</div>
        </div>

        <!-- 操作按钮 -->
        <div class="action-bar" id="actionBar" style="display: none;">
            <button id="copyBtn" class="action-btn">复制 JSON</button>
            <button id="clearBtn" class="action-btn">清除</button>
        </div>

        <!-- 分页控件 -->
        <div class="pagination" id="pagination" style="display: none;">
            <button id="prevPageBtn" disabled>◀ 上一页</button>
            <span class="page-info" id="pageInfo">1 / 1</span>
            <button id="nextPageBtn" disabled>下一页 ▶</button>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="site-footer">
        数据来源 <a href="https://www.npmjs.com/package/genshin-db" target="_blank" rel="noopener">genshin-db</a> · 风格参考 <a href="https://baike.mihoyo.com/ys/obc/" target="_blank" rel="noopener">米哈游观测枢</a> · by LingLan
    </footer>

    <script src="./js/app.js"></script>
</body>
</html>
