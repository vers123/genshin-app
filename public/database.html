<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库百科 - 原神数据库</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/database.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="site-header">
        <div class="site-header-inner">
            <a href="./index.html" class="site-logo">
                <span class="site-logo-icon">&#127793;</span>
                <span class="site-logo-text">原神数据库</span>
            </a>
            <nav class="site-nav">
                <a href="./index.html">首页</a>
                <a href="./search.html">搜索</a>
                <a href="./database.html" class="active">百科</a>
            </nav>
            <div class="site-lang">
                <select id="dbLangSelect">
                    <option value="ChineseSimplified">简体中文</option>
                    <option value="ChineseTraditional">繁體中文</option>
                    <option value="English">English</option>
                    <option value="Japanese">日本語</option>
                    <option value="Korean">한국어</option>
                    <option value="French">Français</option>
                    <option value="German">Deutsch</option>
                    <option value="Indonesian">Bahasa Indonesia</option>
                    <option value="Portuguese">Português</option>
                    <option value="Russian">Русский</option>
                    <option value="Spanish">Español</option>
                    <option value="Thai">ภาษาไทย</option>
                    <option value="Vietnamese">Tiếng Việt</option>
                </select>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="db-main">
        <!-- 面包屑导航 -->
        <div class="db-breadcrumb" id="dbBreadcrumb">
            <span class="crumb" data-route="home">百科首页</span>
        </div>

        <!-- 首页：分类入口 -->
        <section class="db-home" id="dbHome">
            <div class="db-home-title">
                <h2>数据百科</h2>
                <p>浏览原神全数据 · 卡片图鉴 · 展开查看详情</p>
            </div>

            <div class="db-category-grid" id="dbCategoryGrid">
                <div class="db-loading">
                    <div class="spinner"></div>
                    <p>正在加载分类...</p>
                </div>
            </div>
        </section>

        <!-- 分类页：物品卡片网格 -->
        <section class="db-category-page" id="dbCategoryPage" style="display:none;">
            <div class="db-category-header">
                <h2 id="dbCategoryTitle"></h2>
                <span class="db-item-count" id="dbItemCount"></span>
            </div>

            <div class="db-filter-bar">
                <input type="text" id="dbFilterInput" placeholder="筛选名称..." class="db-filter-input" />
                <div class="db-sort-pills" id="dbSortPills">
                    <span class="db-sort-pill active" data-sort="default">默认</span>
                    <span class="db-sort-pill" data-sort="rarity-desc">稀有度 &#8595;</span>
                    <span class="db-sort-pill" data-sort="rarity-asc">稀有度 &#8593;</span>
                    <span class="db-sort-pill" data-sort="name-asc">A-Z</span>
                    <span class="db-sort-pill" data-sort="name-desc">Z-A</span>
                </div>
            </div>

            <div class="db-card-grid" id="dbCardGrid">
            </div>

            <div class="db-pagination" id="dbPagination" style="display:none;">
                <button id="dbPrevBtn" disabled>&#9664; 上一页</button>
                <span id="dbPageInfo" class="db-page-info">1 / 1</span>
                <button id="dbNextBtn" disabled>下一页 &#9654;</button>
            </div>
        </section>
    </main>

    <!-- 详情面板（模态框） -->
    <div class="db-detail-overlay" id="dbDetailOverlay" style="display:none;">
        <div class="db-detail-panel" id="dbDetailPanel">
            <button class="db-detail-close" id="dbDetailClose">&times;</button>
            <!-- Hero 区域 -->
            <div class="db-detail-hero" id="dbDetailHero">
                <div class="db-detail-hero-content">
                    <div class="db-detail-hero-img" id="dbDetailHeroImg"></div>
                    <div class="db-detail-hero-text">
                        <div class="hero-name" id="dbDetailTitle">详情</div>
                        <div class="hero-subtitle" id="dbDetailSubtitle"></div>
                    </div>
                </div>
            </div>
            <!-- 侧边目录 + 内容区 -->
            <div class="db-detail-layout">
                <nav class="db-detail-toc" id="dbDetailToc" style="display:none;">
                    <div class="db-detail-toc-title">目录</div>
                    <ul id="dbDetailTocList"></ul>
                </nav>
                <div class="db-detail-body" id="dbDetailBody">
                    <div class="db-loading">
                        <div class="spinner"></div>
                        <p>正在加载详情...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="site-footer">
        数据来源 <a href="https://www.npmjs.com/package/genshin-db" target="_blank" rel="noopener">genshin-db</a> · 风格参考 <a href="https://baike.mihoyo.com/ys/obc/" target="_blank" rel="noopener">米哈游观测枢</a> · by LingLan
    </footer>

    <script src="./js/database.js"></script>
</body>
</html>
